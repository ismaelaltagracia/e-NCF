# ───────────────────────────────────────────────────────────────────────────
# Override de PRODUCCIÓN para el servidor Debian.
#
# Uso en el servidor:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Qué cambia respecto al compose base:
#   1. Persistencia con BIND MOUNTS a /opt/e-ncf-data (explícito, fácil de respaldar,
#      NO se borra con `docker compose down -v`).
#   2. Postgres/Redis/MinIO NO se exponen a internet (sin "ports"): solo accesibles
#      por la red interna de Docker. El backend sí (lo publica Nginx).
#   3. Límites de recursos y rotación de logs para estabilidad en el servidor.
#
# Crea los directorios en el servidor antes del primer arranque:
#   sudo mkdir -p /opt/e-ncf-data/{postgres,redis,minio,backups}
# ───────────────────────────────────────────────────────────────────────────

services:
  app:
    restart: always
    # El backend NO se publica a internet: Nginx (abajo) es el único punto de
    # entrada y hace proxy a app:3000 por la red interna de Docker.
    # !override reemplaza la lista del compose base (que publicaba 3000:3000).
    ports: !override []
    volumes:
      # Mismo bind mount de backups (solo lectura) + las llaves JWT/certs.
      - /opt/e-ncf-data/backups:/backups:ro
      - ./keys:/app/keys:ro
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    restart: always
    # !override reemplaza por completo la lista de puertos del compose base
    # (no la fusiona). Resultado: Postgres solo accesible en la red interna de Docker.
    ports: !override []
    volumes:
      - /opt/e-ncf-data/postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    restart: always
    ports: !override []
    volumes:
      - /opt/e-ncf-data/redis:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    restart: always
    # MinIO solo accesible internamente; la consola (9001) no se expone.
    ports: !override []
    volumes:
      # Bitnami MinIO guarda los datos en /bitnami/minio/data.
      - /opt/e-ncf-data/minio:/bitnami/minio/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    restart: always
    volumes:
      - /opt/e-ncf-data/backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/backup-entrypoint.sh:/scripts/backup-entrypoint.sh:ro

  # ───────────────────────────────────────────────────────────────────────
  # Reverse proxy + TLS. Único servicio expuesto a internet (80/443).
  # ───────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: encf-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /opt/e-ncf-data/letsencrypt:/etc/letsencrypt:ro
      - /opt/e-ncf-data/certbot-www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    # Recarga la config cada 6h para tomar certificados renovados por certbot.
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    networks:
      - encf-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Renovación automática del certificado Let's Encrypt. La emisión INICIAL se
  # hace una sola vez con scripts/init-letsencrypt.sh (ver docs).
  certbot:
    image: certbot/certbot:latest
    container_name: encf-certbot
    restart: always
    volumes:
      - /opt/e-ncf-data/letsencrypt:/etc/letsencrypt
      - /opt/e-ncf-data/certbot-www:/var/www/certbot
    # Intenta renovar cada 12h; certbot solo renueva si falta < 30 días.
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - encf-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
