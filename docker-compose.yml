services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: encf-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - backup_data:/backups:ro
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - encf-network

  postgres:
    image: postgres:16-alpine
    container_name: encf-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-encf_db}
      POSTGRES_USER: ${DB_USER:-encf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-encf_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-encf_user} -d ${DB_NAME:-encf_db}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - encf-network

  redis:
    image: redis:7-alpine
    container_name: encf-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-encf_redis_pass} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-encf_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - encf-network

  minio:
    # MinIO retiró minio/minio de Docker Hub (sep 2026) y quay exige auth.
    # Se usa la imagen pública de Bitnami (legacy) con tag fijo.
    image: bitnamilegacy/minio:2025.7.23
    container_name: encf-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-encf_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-encf_minio_secret}
      # Bitnami: puerto de API y consola, y desactivar chequeo de versión saliente.
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_SKIP_CLIENT: "yes"
    volumes:
      # La imagen de Bitnami guarda los datos en /bitnami/minio/data.
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - encf-network

  backup:
    image: postgres:16-alpine
    container_name: encf-backup
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-encf_db}
      DB_USER: ${DB_USER:-encf_user}
      DB_PASSWORD: ${DB_PASSWORD:-encf_password}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/backup-entrypoint.sh:/scripts/backup-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/scripts/backup-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - encf-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backup_data:
    driver: local

networks:
  encf-network:
    driver: bridge
