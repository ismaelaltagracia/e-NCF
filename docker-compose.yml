services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: encf-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - encf-network

  postgres:
    image: postgres:16-alpine
    container_name: encf-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-encf_db}
      POSTGRES_USER: ${DB_USER:-encf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-encf_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-encf_user} -d ${DB_NAME:-encf_db}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - encf-network

  redis:
    image: redis:7-alpine
    container_name: encf-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-encf_redis_pass} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-encf_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - encf-network

  minio:
    image: minio/minio:latest
    container_name: encf-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-encf_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-encf_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - encf-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  encf-network:
    driver: bridge
