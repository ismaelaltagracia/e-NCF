# ───────────────────────────────────────────────────────────────────────────
# Reverse proxy para e-mitte.com (producción).
#
# - Puerto 80: sirve el challenge ACME de Let's Encrypt y redirige el resto a HTTPS.
# - Puerto 443: termina TLS y hace proxy al backend (contenedor "app" en :3000).
#
# El certificado lo emite/renueva certbot y queda en /etc/letsencrypt (volumen
# compartido). Antes de que exista el certificado, el bloque 443 no puede cargar;
# por eso el primer arranque usa solo el bloque 80 (ver init-letsencrypt.sh).
# ───────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name e-mitte.com www.e-mitte.com;

    # Challenge de Let's Encrypt (webroot). Debe responderse por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás va a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name e-mitte.com www.e-mitte.com;

    # Certificados emitidos por certbot (Let's Encrypt).
    ssl_certificate /etc/letsencrypt/live/e-mitte.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-mitte.com/privkey.pem;

    # Parámetros TLS recomendados.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Tamaño de subida: certificados .p12 y cargas de facturas en lote.
    client_max_body_size 25m;

    # La SPA se sirve bajo /app. Quien entre a la raíz del dominio es redirigido
    # a la aplicación (evita ver el "Hello World!" del endpoint raíz del backend).
    location = / {
        return 301 /app/;
    }

    # Proxy al backend NestJS (servicio "app" en la red interna de Docker).
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
