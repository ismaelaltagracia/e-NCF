name: Deploy a producción

# Se dispara al hacer push/merge a la rama "produccion".
# También permite lanzarlo manualmente desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [produccion]
  workflow_dispatch:

# Evita despliegues solapados: si llega un push mientras otro deploy corre,
# se cancela el anterior en curso.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en servidor Debian
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # Falla el job si cualquier comando del script falla.
          script_stop: true
          command_timeout: "20m"
          script: |
            set -e
            cd /opt/e-ncf

            echo "== Backup de la BD antes de actualizar =="
            # Lee DB_USER/DB_NAME del .env SIN usar `source` (evita que caracteres
            # especiales del .env rompan el script). grep + sed para quitar comillas.
            DB_USER=$(grep -E '^DB_USER=' /opt/e-ncf/.env | head -1 | cut -d= -f2- | sed -e 's/^["'\'']//' -e 's/["'\'']$//')
            DB_NAME=$(grep -E '^DB_NAME=' /opt/e-ncf/.env | head -1 | cut -d= -f2- | sed -e 's/^["'\'']//' -e 's/["'\'']$//')
            docker exec encf-postgres pg_dump -U "$DB_USER" "$DB_NAME" \
              | gzip > "/opt/e-ncf-data/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz" || \
              echo "AVISO: backup pre-deploy omitido (¿primer despliegue o BD no lista?)"

            echo "== Traer la nueva versión =="
            git fetch origin produccion --prune
            # -B crea o reposiciona la rama local 'produccion' sobre origin/produccion,
            # aunque el servidor estuviera en otra rama (p.ej. 'inicio').
            git checkout -B produccion origin/produccion
            git reset --hard origin/produccion

            echo "== Rebuild y recreación de contenedores (datos persisten) =="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "== Recargar Nginx (toma cambios de nginx/conf.d, que es un volumen) =="
            # La config de Nginx se monta por volumen; `up -d` no reinicia el
            # contenedor cuando solo cambia un archivo montado. Recargamos para
            # que tome cambios (p. ej. redirects/proxy). Si no existe aún, se ignora.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null \
              || docker compose -f docker-compose.yml -f docker-compose.prod.yml restart nginx 2>/dev/null \
              || echo "AVISO: Nginx aún no disponible (¿primer despliegue?)"

            echo "== Limpieza de imágenes viejas =="
            docker image prune -f

            echo "== Verificación de salud =="
            # El backend ya NO publica el puerto 3000 (Nginx es el único punto de
            # entrada). Verificamos la salud DENTRO del contenedor, que no depende
            # de puertos publicados.
            sleep 12
            for i in $(seq 1 10); do
              if docker exec encf-api wget --no-verbose --tries=1 --spider http://localhost:3000/health 2>/dev/null; then
                echo "OK: la app responde /health (interno)"
                exit 0
              fi
              echo "Esperando a que la app levante... ($i/10)"
              sleep 5
            done
            echo "ERROR: la app no respondió /health tras el deploy"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 app
            exit 1
